[workspace]
resolver = "2"
members = ["crates/core", "crates/host", "crates/app", "xtask"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.dependencies]
linkgroupz-core = { path = "crates/core" }

base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
