<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- LinkGroupz 앱 아이콘: 그룹 카드 세 장. `cargo xtask icons` 가 crates/app/icons/ 의 그림들로 만든다. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9B6BFF"/>
      <stop offset="1" stop-color="#5A3BD6"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1B0F52" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g filter="url(#lift)">
    <rect x="216" y="262" width="592" height="140" rx="44" fill="#FFFFFF"/>
    <rect x="216" y="442" width="592" height="140" rx="44" fill="#FFFFFF"/>
    <rect x="216" y="622" width="592" height="140" rx="44" fill="#FFFFFF"/>
  </g>
  <rect x="246" y="292" width="80" height="80" rx="24" fill="#F59E0B"/>
  <rect x="246" y="472" width="80" height="80" rx="24" fill="#10B981"/>
  <rect x="246" y="652" width="80" height="80" rx="24" fill="#3B82F6"/>
  <rect x="362" y="314" width="330" height="36" rx="18" fill="#CFC2F7"/>
  <rect x="362" y="494" width="250" height="36" rx="18" fill="#CFC2F7"/>
  <rect x="362" y="674" width="390" height="36" rx="18" fill="#CFC2F7"/>
</svg>
