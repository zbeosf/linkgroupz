[package]
name = "linkgroupz"
description = "자주 여는 웹 페이지를 그룹으로 묶어 Chrome · Edge 에 한 번에 여는 메뉴바 · 트레이 앱"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "linkgroupz"

[lib]
name = "linkgroupz_app"

[[bin]]
name = "linkgroupz"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
linkgroupz-core.workspace = true

base64.workspace = true
image.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "native-tls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon", "unstable"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["sync", "time"] }
url.workspace = true
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-global-shortcut = "2"
# 시스템 언어 (설정에서 언어를 '시스템'으로 두었을 때)
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSArray",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSHTTPCookie",
    "NSObject",
    "NSSet",
    "NSString",
    "NSURL",
] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "WKHTTPCookieStore",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile.workspace = true

[features]
# `cargo tauri build` 가 켠다. 꺼져 있으면(cargo run) 화면 파일을 실행할 때 ui/ 폴더에서 읽는다.
custom-protocol = ["tauri/custom-protocol"]
